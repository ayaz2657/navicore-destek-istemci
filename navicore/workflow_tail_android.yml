jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

#--AND--

      - name: NaviCore APK adi
        shell: bash
        run: |
          IN="signed-apk/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk"
          [ -f "$IN" ] || { echo "$IN yok"; ls -la signed-apk || true; exit 1; }
          mkdir -p NaviCoreOutput
          mv "$IN" "NaviCoreOutput/NaviCore-Destek-${{ env.VERSION }}-${{ matrix.job.arch }}-test.apk"
          (cd NaviCoreOutput && sha256sum *.apk | tee "SHA256SUMS-${{ matrix.job.arch }}.txt")

      - name: Upload NaviCore APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NaviCore-Destek-${{ env.VERSION }}-${{ matrix.job.arch }}-apk
          path: ./NaviCoreOutput
          if-no-files-found: error
          retention-days: 30

  publish-navicore-android:
    needs: [build-rustdesk-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: NaviCore-Destek-*-apk
          path: ./out
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat ./out/SHA256SUMS-*.txt > ./out/SHA256SUMS.txt && rm ./out/SHA256SUMS-*.txt
          TAG="navicore-android-${{ env.VERSION }}-r${{ github.run_number }}"
          gh release create "$TAG" ./out/*.apk ./out/SHA256SUMS.txt \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "NaviCore Destek Android ${{ env.VERSION }} (derleme ${{ github.run_number }}, TEST imzasi)" \
            --notes "RustDesk ${{ env.VERSION }} tabanli NaviCore Destek Android (arm64 = cogu telefon, armv7 = eski telefon). CI gecici anahtariyla imzali: YALNIZ TEST, guncellenemez. AGPL-3.0, kaynak bu repoda."
